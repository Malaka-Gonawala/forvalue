<!doctype html>
<!-- S-D10 · Ordini ricevuti (sawmill). Orders on this sawmill's offers. A new order (Inviato) can be
     accepted (stato accettato) or refused (stato rifiutato: the quantity goes back to the offer). -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3F">
<title>Ordini ricevuti · ForValue</title>
<link rel="icon" href="img/favicon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/desk.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body class="desk">
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
<script>var S = FV.auth.require(['segheria']);</script>
<div id="sb"></div>
<main class="main">
  <div class="pg" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">
    <div><div class="crumb" id="crumb"></div><h1 class="h1">Ordini ricevuti</h1></div>
    <div class="dinput" style="width:300px"><span class="ms" aria-hidden="true">search</span><input id="q" type="search" placeholder="Cerca acquirente o prodotto" aria-label="Cerca acquirente o prodotto"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-f="">Tutti</button><button role="tab" data-f="inviato">Da gestire</button><button role="tab" data-f="accettato">Accettati</button><button role="tab" data-f="consegnato">Consegnati</button><button role="tab" data-f="rifiutato">Rifiutati</button>
  </div>
  <section class="box">
    <table class="rt"><thead><tr><th>Ordine</th><th>Data</th><th>Acquirente</th><th>Prodotto</th><th>Quantità</th><th>Totale</th><th>Stato</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main>
<script>
  var ui = FV.ui, st = FV.store, me = S.azienda.id;
  ui.shell('ordini');
  document.getElementById('crumb').innerHTML = ui.esc(S.azienda.ragione_sociale) + ' <span class="ms" aria-hidden="true">chevron_right</span> Ordini ricevuti';
  function ords() {
    return st.all('ordine').filter(function (o) { var off = st.byId('offerta', o.id_offerta); return off && off.id_azienda === me; })
      .sort(function (a, b) { return b.id - a.id; });
  }
  var filter = '';
  function draw() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    document.querySelectorAll('#tabs [role=tab]').forEach(function (t) { t.setAttribute('aria-selected', t.getAttribute('data-f') === filter); });
    var rows = ords().filter(function (o) {
      var off = st.byId('offerta', o.id_offerta), buyer = st.byId('azienda', o.id_azienda);
      return (!filter || o.stato === filter) && (!q || (String(o.id) + ' ' + off.titolo + ' ' + buyer.ragione_sociale).toLowerCase().indexOf(q) >= 0);
    });
    document.getElementById('rows').innerHTML = rows.map(function (o) {
      var off = st.byId('offerta', o.id_offerta), l = st.lottoOfOfferta(off), buyer = st.byId('azienda', o.id_azienda);
      var act = o.stato === 'inviato'
        ? '<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="dbtn sec" data-act="rifiutato" data-id="' + o.id + '">Rifiuta</button>' +
          '<button type="button" class="dbtn pri" data-act="accettato" data-id="' + o.id + '"><span class="ms" aria-hidden="true">check</span>Accetta</button></div>'
        : (l && o.stato !== 'rifiutato' ? '<a class="dbtn sec" href="' + ui.esc(ui.qrUrl(l)) + '"><span class="ms" aria-hidden="true">qr_code_2</span>Tracciabilità</a>' : '');
      return '<tr><td data-pre="Ordine n. ">' + ui.v(o, 'id') + '</td><td>' + ui.v(o, 'data', ui.date(o.data)) + '</td><td style="font-weight:600">' + ui.esc(buyer.ragione_sociale) + '</td><td>' + ui.esc(off.titolo) + '</td>' +
        '<td class="num">' + ui.num(o.quantita) + ' ' + st.unitOf(off) + '</td><td class="num" style="font-weight:600">' + ui.euro(o.prezzo_totale) + '</td><td>' + ui.ordinePill(o.stato) + '</td>' +
        '<td style="text-align:right">' + act + '</td></tr>';
    }).join('') || '<tr><td colspan="8"><div class="empty" style="padding:24px"><span class="ms" aria-hidden="true">move_to_inbox</span>Nessun ordine.</div></td></tr>';
  }
  document.getElementById('rows').onclick = function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var stato = b.getAttribute('data-act'), id = Number(b.getAttribute('data-id'));
    if (stato === 'rifiutato' && !confirm('Rifiutare l\'ordine? La quantità torna disponibile nell\'offerta.')) return;
    st.setStatoOrdine(id, stato);
    draw(); ui.toast(stato === 'accettato' ? 'Ordine accettato' : 'Ordine rifiutato');
  };
  document.getElementById('tabs').onclick = function (e) { var t = e.target.closest('[data-f]'); if (t) { filter = t.getAttribute('data-f'); draw(); } };
  document.getElementById('q').oninput = draw;
  draw();
</script>
</body>
</html>
