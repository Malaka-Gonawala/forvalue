<!doctype html>
<!-- D1 · Dashboard segheria (Figma "D1 Dashboard"). 4 KPIs computed from storage (like demo
     queries 4 and 5), the volume chart and the last 5 batches. Logo = switch to the buyer (D3). -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3F">
<title>Dashboard · ForValue</title>
<link rel="icon" href="img/favicon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/desk.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body class="desk">
<script src="js/i18n.js"></script><script src="js/data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
<script>var S = FV.auth.require(['segheria']);</script>
<div id="sb"></div>
<main class="main">
  <div class="pg" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">
    <div><div class="crumb" id="crumb"></div><h1 class="h1">Dashboard</h1></div>
    <div class="dfield"><label for="period" class="sr">Periodo del grafico</label>
      <div class="dinput" style="width:180px"><select id="period"><option value="m" selected>Mese</option><option value="q">Trimestre</option><option value="y">Anno</option></select><span class="ms" aria-hidden="true">expand_more</span></div></div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px" id="kpis"></div>

  <section class="box" style="padding:16px 20px;display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:15px" id="chartTitle">Volume scambiato (m³)</h2>
    <div id="chart" style="display:flex;gap:24px;height:170px;align-items:flex-end;background:repeating-linear-gradient(to top,transparent 0 41px,var(--line) 41px 42px)"></div>
  </section>

  <section class="box">
    <div style="padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:15px">Ultimi 5 lotti</h2><a class="xs" href="segheria-lotti.html" style="color:var(--g700);font-weight:600">Tutti i lotti</a></div>
    <table class="rt"><thead><tr><th>Lotto</th><th>Specie</th><th>Volume</th><th>Badge</th><th>Stato</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main>

<script>
  var ui = FV.ui, st = FV.store, me = S.azienda.id;
  ui.shell('dashboard');
  document.getElementById('crumb').innerHTML = ui.esc(S.azienda.ragione_sociale) + ' <span class="ms" aria-hidden="true">chevron_right</span> Dashboard';

  // Orders on this sawmill's offers (query 4), only wood sold in m³
  var myOffers = st.all('offerta').filter(function (o) { return o.id_azienda === me; });
  var ordM3 = st.all('ordine').filter(function (o) {
    var off = myOffers.find(function (x) { return x.id === o.id_offerta; });
    return off && st.ordineValido(o) && st.unitOf(off) === 'm³';
  });
  var vol = ordM3.reduce(function (s, o) { return s + o.quantita; }, 0);
  var tot = ordM3.reduce(function (s, o) { return s + o.prezzo_totale; }, 0);
  // Batches received by this sawmill (query 5)
  var lotti = st.lottiOfSawmill(me);
  var cert = lotti.filter(function (l) { return l.certificato; }).length;
  var co2 = lotti.reduce(function (s, l) { return s + l.volume_m3 * st.byId('specie', l.id_specie).fattore_co2; }, 0);

  function kpi(label, value, unit, hl) {
    return '<div class="box kpi' + (hl ? ' hl' : '') + '"><small>' + label + '</small><b>' + value + ' <small>' + unit + '</small></b></div>';
  }
  document.getElementById('kpis').innerHTML =
    kpi('Volume scambiato', ui.num(vol), 'm³') +
    kpi('Prezzo medio', vol ? ui.euro(tot / vol).replace(' €', '') : '–', '€/m³') +
    kpi('% legno certificato', lotti.length ? ui.num(Math.round(cert / lotti.length * 100)) : '–', '%', true) +
    kpi('CO₂ stoccata', new Intl.NumberFormat(FV.i18n.loc, { maximumFractionDigits: 1 }).format(co2), 't');

  // Chart: m³ per month / quarter / year
  function drawChart() {
    var mode = document.getElementById('period').value, groups = {};
    ordM3.forEach(function (o) {
      var y = o.data.slice(0, 4), m = Number(o.data.slice(5, 7));
      var key = mode === 'y' ? y : mode === 'q' ? y + '-Q' + Math.ceil(m / 3) : o.data.slice(0, 7);
      groups[key] = (groups[key] || 0) + o.quantita;
    });
    var keys = Object.keys(groups).sort().slice(-8);
    var max = Math.max.apply(null, keys.map(function (k) { return groups[k]; }).concat([1]));
    function label(k) {
      if (mode === 'y') return k;
      if (mode === 'q') return k.slice(5) + ' ' + k.slice(0, 4);
      return ui.MESI[Number(k.slice(5, 7)) - 1] + ' ' + k.slice(0, 4);
    }
    document.getElementById('chartTitle').textContent = 'Volume scambiato per ' + { m: 'mese', q: 'trimestre', y: 'anno' }[mode] + ' (m³)';
    document.getElementById('chart').innerHTML = keys.length ? keys.map(function (k, i) {
      var h = Math.round(groups[k] / max * 130);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%">' +
        '<span class="xs num" style="font-weight:600">' + ui.num(groups[k]) + '</span>' +
        '<div title="' + ui.num(groups[k]) + ' m³" style="width:100%;max-width:72px;height:' + h + 'px;background:' + (i === keys.length - 1 ? 'var(--g700)' : 'var(--g500)') + ';border-radius:4px 4px 0 0"></div>' +
        '<span class="muted xs">' + label(k) + '</span></div>';
    }).join('') : '<div class="muted" style="margin:auto">Nessun ordine ancora.</div>';
  }
  document.getElementById('period').onchange = drawChart;
  drawChart();

  // Last 5 batches received (newest transfer first)
  var last = lotti.slice().sort(function (a, b) { return st.transferDate(a.id) < st.transferDate(b.id) ? 1 : -1; }).slice(0, 5);
  document.getElementById('rows').innerHTML = last.map(function (l) {
    var stato = st.statoLotto(l.id), canSell = ui.canSell(l);
    return '<tr class="click" data-href="lotto.html?c=' + encodeURIComponent(l.codice_qr) + '">' +
      '<td style="font-weight:600"><a href="lotto.html?c=' + encodeURIComponent(l.codice_qr) + '">' + ui.v(l, 'codice_qr') + '</a></td>' +
      '<td>' + ui.esc(ui.specieName(l)) + '</td><td class="num">' + ui.num(l.volume_m3) + ' m³</td>' +
      '<td><div class="pills">' + ui.certPill(l.certificato) + ui.eudrPill(st.eudrOk(l), true) + '</div></td>' +
      '<td>' + ui.statoPill(stato) + '</td>' +
      '<td style="text-align:right">' + (canSell ? '<a class="dbtn pri" href="lotto.html?c=' + encodeURIComponent(l.codice_qr) + '&vendi=1">Vendi</a>' : '') + '</td></tr>';
  }).join('') || '<tr><td colspan="6" class="muted">Nessun lotto ricevuto.</td></tr>';
  document.getElementById('rows').onclick = function (e) {
    if (e.target.closest('a')) return;
    var tr = e.target.closest('tr[data-href]'); if (tr) location.href = tr.getAttribute('data-href');
  };
</script>
</body>
</html>
