<!doctype html>
<!-- P4 · Altro (Figma "P4 Altro"), for every role. Owner: Certificati, Notifiche, Aiuto. Sawmill: Le mie offerte,
     Circolarità, Aiuto. Buyer: Circolarità, Aiuto. Then Ripristina dati demo and Esci. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altro · ForValue</title>
<meta name="theme-color" content="#2E6B3F">
<link rel="icon" href="img/favicon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body class="phone app has-tabs">
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
<script>var S = FV.auth.require(['proprietario', 'segheria', 'acquirente']);</script>
<div id="bar"></div>
<div class="hero" style="padding:4px 16px 56px"><h1 class="h1">Altro</h1><div class="sub" id="who"></div></div>
<main class="over" style="margin-top:-40px">
  <nav class="box lift" aria-label="Altro" id="links"></nav>
  <div class="box">
    <button type="button" class="row" data-reset><span class="tile"><span class="ms" aria-hidden="true">restart_alt</span></span><span class="grow"><b style="font-weight:600">Ripristina dati demo</b><div class="small muted">Riporta lotti, offerte e ordini ai dati iniziali</div></span></button>
  </div>
  <div class="box">
    <button type="button" class="row" data-logout style="color:var(--err)"><span class="tile" style="background:#FBE9E7;color:var(--err)"><span class="ms" aria-hidden="true">logout</span></span><span class="grow" style="font-weight:600">Esci</span></button>
  </div>
</main>
<script>
  var ui = FV.ui, st = FV.store;
  document.getElementById('bar').innerHTML = ui.phoneBar({ hotspot: ui.hotspot() });
  ui.shell('altro', { title: 'Altro' });
  document.getElementById('who').textContent = S.azienda.ragione_sociale;
  var c = st.all('certificazione').find(function (x) { return x.id_azienda === S.azienda.id; });
  var certLine = c ? c.schema + ' · valido fino al ' + c.data_scadenza.slice(0, 4) : 'Nessun certificato';
  // [href, icon, label, second line]
  var LINKS = {
    proprietario: [['certificati.html', 'workspace_premium', 'Certificati', certLine], ['notifiche.html', 'notifications', 'Notifiche'], ['aiuto.html', 'help', 'Aiuto']],
    segheria: [['offerte.html', 'sell', 'Le mie offerte'], ['offerte.html?cat=scarti', 'recycling', 'Circolarità', 'Scarti rimessi in circolo'], ['aiuto.html', 'help', 'Aiuto']],
    acquirente: [['marketplace.html?tab=scarti', 'recycling', 'Circolarità', 'Scarti di segheria in vendita'], ['aiuto.html', 'help', 'Aiuto']]
  };
  document.getElementById('links').innerHTML = LINKS[S.ruolo].map(function (x) {
    return '<a class="row" href="' + x[0] + '"><span class="tile"><span class="ms" aria-hidden="true">' + x[1] + '</span></span><span class="grow"><b style="font-weight:600">' + x[2] + '</b>' +
      (x[3] ? '<div class="small muted">' + ui.esc(x[3]) + '</div>' : '') + '</span><span class="ms chev" aria-hidden="true">chevron_right</span></a>';
  }).join('');
</script>
</body>
</html>
