<!doctype html>
<!-- P5 · I miei lotti (Figma "P5 Lotti"). All the owner's batches, filters Tutti / Disponibili / Venduti. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I miei lotti · ForValue</title>
<meta name="theme-color" content="#2E6B3F">
<link rel="icon" href="img/favicon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body class="phone app has-tabs">
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
<script>var S = FV.auth.require(['proprietario']);</script>
<div id="bar"></div>
<div class="hero" style="padding:4px 16px 20px;gap:8px"><h1 class="h1">I miei lotti</h1><div class="sub" id="who"></div>
  <div class="fchips" role="group" aria-label="Filtra i lotti" id="chips" style="margin-top:4px">
    <button type="button" class="fchip" data-f="">Tutti</button><button type="button" class="fchip" data-f="Disponibile">Disponibili</button><button type="button" class="fchip" data-f="Venduto">Venduti</button></div></div>
<main class="over" style="padding-top:16px;padding-bottom:16px"><div id="list" style="display:flex;flex-direction:column;gap:12px"></div></main>
<script>
  var ui = FV.ui, st = FV.store, filter = '';
  document.getElementById('bar').innerHTML = ui.phoneBar();
  ui.shell('lotti', { title: 'I miei lotti' });
  document.getElementById('who').textContent = S.azienda.ragione_sociale;
  var lotti = st.lottiOfOwner(S.azienda.id).sort(function (a, b) { return a.codice_qr < b.codice_qr ? 1 : -1; });
  function draw() {
    document.querySelectorAll('#chips .fchip').forEach(function (c) { c.setAttribute('aria-pressed', c.getAttribute('data-f') === filter); });
    // "Disponibili" = not sold yet (Disponibile or Riservato)
    var list = lotti.filter(function (l) { var s = st.statoLotto(l.id); return !filter || (filter === 'Disponibile' ? s !== 'Venduto' : s === filter); });
    document.getElementById('list').innerHTML = list.map(function (l) {
      return '<a class="box lcard" href="' + ui.esc(ui.qrUrl(l)) + '"><div class="top">' + ui.v(l, 'codice_qr') + '<span class="ms chev" aria-hidden="true">chevron_right</span></div>' +
        '<div class="meta small">' + ui.esc(ui.specieName(l)) + ' · ' + ui.num(l.volume_m3) + ' m³ · Taglio ' + ui.date(l.data_taglio) + '</div><div class="pills">' + ui.badges(l) + '</div></a>';
    }).join('') || '<div class="box empty"><span class="ms" aria-hidden="true">inventory_2</span><div>Nessun lotto qui.</div><a class="btn gold" href="nuovo-lotto.html"><span class="ms" aria-hidden="true">add</span>Nuovo lotto</a></div>';
  }
  document.getElementById('chips').onclick = function (e) { var c = e.target.closest('[data-f]'); if (c) { filter = c.getAttribute('data-f'); draw(); } };
  draw();
</script>
</body>
</html>
