<!doctype html>
<!-- P4 · Altro (Figma "P4 Altro"). Certificati, Notifiche, Aiuto, Ripristina dati demo, Esci. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altro · ForValue</title>
<meta name="theme-color" content="#2E6B3F">
<link rel="icon" href="img/favicon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body class="phone has-tabs">
<script src="js/data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
<script>var S = FV.auth.require(['proprietario']);</script>
<div id="bar"></div>
<div class="hero" style="padding:4px 16px 56px"><h1 class="h1">Altro</h1><div class="sub" id="who"></div></div>
<main class="over" style="margin-top:-40px">
  <nav class="box lift" aria-label="Altro">
    <a class="row" href="certificati.html"><span class="tile"><span class="ms" aria-hidden="true">workspace_premium</span></span><span class="grow"><b style="font-weight:600">Certificati</b><div class="small muted" id="certLine"></div></span><span class="ms chev" aria-hidden="true">chevron_right</span></a>
    <a class="row" href="notifiche.html"><span class="tile"><span class="ms" aria-hidden="true">notifications</span></span><span class="grow" style="font-weight:600">Notifiche</span><span class="ms chev" aria-hidden="true">chevron_right</span></a>
    <a class="row" href="aiuto.html"><span class="tile"><span class="ms" aria-hidden="true">help</span></span><span class="grow" style="font-weight:600">Aiuto</span><span class="ms chev" aria-hidden="true">chevron_right</span></a>
  </nav>
  <div class="box">
    <button type="button" class="row" data-reset><span class="tile"><span class="ms" aria-hidden="true">restart_alt</span></span><span class="grow"><b style="font-weight:600">Ripristina dati demo</b><div class="small muted">Riporta lotti, offerte e ordini ai dati iniziali</div></span></button>
  </div>
  <div class="box">
    <button type="button" class="row" data-logout style="color:var(--err)"><span class="tile" style="background:#FBE9E7;color:var(--err)"><span class="ms" aria-hidden="true">logout</span></span><span class="grow" style="font-weight:600">Esci</span></button>
  </div>
</main>
<div id="tabs"></div>
<script>
  var ui = FV.ui, st = FV.store;
  document.getElementById('bar').innerHTML = ui.phoneBar({ hotspot: 'segheria' });
  document.getElementById('tabs').innerHTML = ui.tabbar('altro');
  document.getElementById('who').textContent = S.azienda.ragione_sociale;
  var c = st.all('certificazione').find(function (x) { return x.id_azienda === S.azienda.id; });
  document.getElementById('certLine').textContent = c ? c.schema + ' · valido fino al ' + c.data_scadenza.slice(0, 4) : 'Nessun certificato';
</script>
</body>
</html>
